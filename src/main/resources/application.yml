server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bff-service

jwt:
  secret: ${JWT_SECRET:StaySyncJWT_SuperSecretKey_Min256Bits_2024!XyZ#AbC}

services:
  usuarios:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8081}
  habitaciones:
    url: ${HABITACIONES_SERVICE_URL:http://localhost:8082}
  reservas:
    url: ${RESERVAS_SERVICE_URL:http://localhost:8083}
  servicios:
    url: ${SERVICIOS_SERVICE_URL:http://localhost:8084}
  pagos:
    url: ${PAGOS_SERVICE_URL:http://localhost:8085}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  info:
    title: StaySync - BFF API
    version: 1.0.0
    description: Backend for Frontend — punto de entrada único para el cliente web

resilience4j:
  circuitbreaker:
    instances:
      usuariosCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        slow-call-duration-threshold: 3s
      habitacionesCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        slow-call-duration-threshold: 3s
      reservasCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        slow-call-duration-threshold: 3s
      serviciosCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
      pagosCB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

http:
  client:
    connect-timeout: 3000
    read-timeout: 5000

logging:
  level:
    com.staysync: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
